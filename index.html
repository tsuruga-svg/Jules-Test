<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配送料金・日数検索アプリ（完成版）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">配送料金・日数検索</h1>

        <!-- 入力エリア -->
        <div class="space-y-4 mb-6">
            <div>
                <label for="prefecture" class="block text-sm font-medium text-gray-700 mb-2">都道府県</label>
                <select id="prefecture" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                    <!-- 47都道府県の選択肢はJavaScriptで生成されます -->
                </select>
            </div>
            <div>
                <label for="municipality" class="block text-sm font-medium text-gray-700 mb-2">市区町村・郡</label>
                <input type="text" id="municipality" placeholder="例: 大阪市, 豊能郡" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>
        </div>

        <button id="searchBtn" class="w-full bg-blue-600 text-white font-bold py-3 px-6 rounded-lg shadow-md hover:bg-blue-700 transition-all duration-300">
            検索
        </button>

        <!-- 結果表示エリア -->
        <div id="resultArea" class="mt-8 border-t pt-6 hidden">
            <h2 class="text-lg font-semibold text-gray-700 mb-4">検索結果</h2>
            <div class="space-y-3">
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg">
                    <span class="text-gray-600">運賃</span>
                    <span id="resultFare" class="font-bold text-xl text-gray-800"></span>
                </div>
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg">
                    <span class="text-gray-600">配送日数</span>
                    <span id="resultDays" class="font-bold text-xl text-gray-800"></span>
                </div>
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg">
                    <span class="text-gray-600">中継料</span>
                    <span id="resultRelayFee" class="font-bold text-xl text-gray-800t"></span>
                </div>
                 <div class="flex justify-between items-center bg-blue-50 p-4 rounded-lg mt-4 border-l-4 border-blue-500">
                    <span class="text-blue-800 font-semibold">合計金額</span>
                    <span id="resultTotal" class="font-bold text-2xl text-blue-800"></span>
                </div>
            </div>
        </div>
        <div id="errorArea" class="mt-6 text-center text-red-500 font-medium hidden">
            <!-- エラーメッセージがここに表示されます -->
        </div>

    </div>

    <script src="script.js" defer></script>
</body>
</html>
